# RoomSync configuration

# SQLite file, created in the working directory on first run
db.file=roomsync.db

# Admin screen password (demo only)
admin.password=admin123

# Registration form URL (opens when students click the link on the login screen).
# Can be the local interactive form (resources/registration_form.html) or a live Google Form URL (e.g. https://forms.gle/...)
form.url=https://docs.google.com/forms/d/e/1FAIpQLSdx36miDfcurWoZS5wJdHBhE-_qcqgCmKa5D_D3FbHPkDgxYA/viewform

# Linked Google Sheet URL for auto-sync:
# 1. In your Google Form, click "Responses" -> "Link to Sheets".
# 2. In that Google Sheet, click File -> Share -> set General Access to "Anyone with the link can view".
# 3. Paste that Google Sheet URL here (RoomSync automatically auto-syncs new submissions):
sheet.sync.url=https://docs.google.com/spreadsheets/d/1Hktzwoi7OOXGhjU54oeAYfTTj_Mies6q0bi53QsHY7E/edit?usp=sharing

# Local server port for instant browser-to-desktop registration
server.port=8080

# Compatibility weights in percent. They must total 100.
weight.SLEEP=20
weight.CLEANLINESS=15
weight.NOISE=15
weight.STUDY=15
weight.SCHEDULE=10
weight.ENVIRONMENT=10
weight.SOCIAL=10
weight.FOOD=5

# Importance multipliers applied to a factor's weight (no requirement = 1.0)
multiplier.MUST=2.0
multiplier.PREFERABLE=1.5
multiplier.NOT_IMPORTANT=0.25

# A MUST factor scoring below this (0-100) excludes the candidate
must.minimum.score=50

# Fewest factors with data on both sides needed to compute a score
min.factors=3
