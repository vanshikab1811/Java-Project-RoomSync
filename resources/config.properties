# RoomSync configuration

# SQLite file, created in the working directory on first run
db.file=roomsync.db

# Admin screen password (demo only)
admin.password=admin123

# Compatibility weights in percent. They must total 100.
weight.SLEEP=20
weight.CLEANLINESS=15
weight.NOISE=15
weight.STUDY=15
weight.SCHEDULE=10
weight.ENVIRONMENT=10
weight.SOCIAL=10
weight.FOOD=5

# Importance multipliers applied to a factor's weight (no requirement = 1.0)
multiplier.MUST=2.0
multiplier.PREFERABLE=1.5
multiplier.NOT_IMPORTANT=0.25

# A MUST factor scoring below this (0-100) excludes the candidate
must.minimum.score=50

# Fewest factors with data on both sides needed to compute a score
min.factors=3
